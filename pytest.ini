[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests with Playwright
    property: Property-based tests with Hypothesis
    slow: Slow running tests
addopts =
    --strict-markers
    --strict-config
    -ra
