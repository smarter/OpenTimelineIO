<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shots Dashboard - Timeline File Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Shots Dashboard</h1>
            <p class="subtitle">Track which files are integrated into your timeline</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <h3>Scan Directory</h3>
                <div class="input-group">
                    <input type="text" id="scan-directory" placeholder="/path/to/media/files" />
                    <button id="scan-btn" class="btn btn-primary">Scan</button>
                </div>
            </div>

            <div class="control-group">
                <h3>Update from Timeline</h3>
                <div class="input-group">
                    <input type="text" id="timeline-path" placeholder="/path/to/timeline.otio" />
                    <button id="update-btn" class="btn btn-primary">Update</button>
                </div>
            </div>

            <div class="control-group">
                <button id="reset-btn" class="btn btn-danger">Reset All</button>
                <button id="refresh-btn" class="btn btn-secondary">Refresh</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">Total Files</div>
            </div>
            <div class="stat-card stat-new">
                <div class="stat-value" id="stat-new">0</div>
                <div class="stat-label">Not Yet Used</div>
            </div>
            <div class="stat-card stat-in-use">
                <div class="stat-value" id="stat-in-use">0</div>
                <div class="stat-label">In Use</div>
            </div>
            <div class="stat-card stat-removed">
                <div class="stat-value" id="stat-removed">0</div>
                <div class="stat-label">Removed</div>
            </div>
        </div>

        <div class="status-bar" id="status-bar">
            <span id="status-text">Ready</span>
        </div>

        <div class="file-lists">
            <div class="file-list">
                <h2 class="list-header header-new">
                    <span>📋 Not Yet Used</span>
                    <span class="count" id="count-new">0</span>
                </h2>
                <div id="files-new" class="files"></div>
            </div>

            <div class="file-list">
                <h2 class="list-header header-in-use">
                    <span>✅ In Use</span>
                    <span class="count" id="count-in-use">0</span>
                </h2>
                <div id="files-in-use" class="files"></div>
            </div>

            <div class="file-list">
                <h2 class="list-header header-removed">
                    <span>🗑️ Removed</span>
                    <span class="count" id="count-removed">0</span>
                </h2>
                <div id="files-removed" class="files"></div>
            </div>
        </div>

        <div class="transitions" id="transitions">
            <h3>Recent Changes</h3>
            <div id="transitions-list"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
