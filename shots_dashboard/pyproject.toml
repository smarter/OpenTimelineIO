[project]
name = "shots-dashboard"
version = "1.0.0"
description = "Interactive dashboard for tracking timeline file usage with OpenTimelineIO"
authors = [
    {name = "OpenTimelineIO Contributors"}
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "opentimelineio>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "basedpyright>=1.10.0",
]

[project.scripts]
shots-dashboard = "shots_dashboard.app:main"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
include = ["shots_dashboard", "tests"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    ".venv",
]

# Strict type checking options
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportUnknownLambdaType = "warning"
reportImplicitStringConcatenation = "warning"
reportMissingSuperCall = "warning"
reportUninitializedInstanceVariable = "warning"
reportInvalidTypeVarUse = "error"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "warning"
reportAssertAlwaysTrue = "warning"
reportSelfClsParameterName = "error"
reportImplicitOverride = "warning"
reportPropertyTypeMismatch = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=shots_dashboard",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["shots_dashboard"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
